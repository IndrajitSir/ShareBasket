# Render blueprint for the backend. The frontend is deployed to Vercel.
# Free plans change over time: confirm current limits in the Render dashboard
# before relying on this for anything other than a demo.
databases:
  - name: sharebasket-db
    databaseName: sharebasket
    user: sharebasket
    plan: free

services:
  - type: web
    name: sharebasket-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./infra/api.Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sharebasket-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      # Set this to the deployed Vercel origin(s), comma separated.
      - key: CORS_ORIGINS
        sync: false
      # Demo only: apply migrations and load synthetic sample data on boot.
      - key: MIGRATE_ON_BOOT
        value: 'true'
      - key: SEED_ON_BOOT
        value: 'true'
      - key: SEED_ALLOW_PRODUCTION
        value: 'true'
